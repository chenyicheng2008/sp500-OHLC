<meta charset="utf-8">
<title>費城半導體指數檢視</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#f4f5f7; --surface:#fbfbfc; --raised:#ffffff; --sunken:#eef0f3;
  --ink:#101317; --ink-2:#565d66; --ink-3:#8a9099;
  --rule:#e2e3e7; --rule-strong:#c9ccd2;
  --accent:#2a78d6; --accent-soft:#e7f0fc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#8a5cd6;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --pos:#2a78d6; --neg:#d03b3b; --mid:#f0efec;
  --grid:#e6e7eb; --axis:#c9ccd2;
  --shadow:0 1px 2px rgba(16,19,23,.05), 0 8px 24px -16px rgba(16,19,23,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0e1013; --surface:#191c21; --raised:#21252b; --sunken:#14171b;
    --ink:#f2f4f7; --ink-2:#b9bec6; --ink-3:#878d96;
    --rule:#2b2f36; --rule-strong:#3c414a;
    --accent:#3987e5; --accent-soft:#152438;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#a07ef0;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --pos:#3987e5; --neg:#e66767; --mid:#383835;
    --grid:#24282e; --axis:#3c414a;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0e1013; --surface:#191c21; --raised:#21252b; --sunken:#14171b;
  --ink:#f2f4f7; --ink-2:#b9bec6; --ink-3:#878d96;
  --rule:#2b2f36; --rule-strong:#3c414a;
  --accent:#3987e5; --accent-soft:#152438;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#a07ef0;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --pos:#3987e5; --neg:#e66767; --mid:#383835;
  --grid:#24282e; --axis:#3c414a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--plane); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.75; margin:0;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px; margin:0 auto; padding-inline:20px; padding-block:0 72px}
h1,h2,h3{font-family:"Noto Serif TC",Georgia,serif; text-wrap:balance; margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace; font-variant-numeric:tabular-nums}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; font-weight:500}

/* ---------- masthead ---------- */
.mast{border-bottom:1px solid var(--rule); background:var(--surface)}
.mast-in{max-width:1080px; margin:0 auto; padding-inline:20px; padding-block:40px 28px}
.kicker{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 14px
}
h1{font-size:clamp(28px,5vw,42px); font-weight:700; line-height:1.25; letter-spacing:-.01em}
.dek{color:var(--ink-2); font-size:16px; max-width:62ch; margin:16px 0 0}
.stamp{
  display:flex; flex-wrap:wrap; gap:8px 22px; margin-top:22px;
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3)
}
.stamp b{color:var(--ink-2); font-weight:500}

/* ---------- verdict ---------- */
.verdict{
  display:grid; grid-template-columns:auto 1fr; gap:0 20px; align-items:start;
  background:var(--raised); border:1px solid var(--rule); border-radius:3px;
  padding:22px 24px; margin-top:28px; box-shadow:var(--shadow);
}
.verdict::before{
  content:""; grid-row:1/3; width:3px; border-radius:2px; align-self:stretch;
  background:var(--warn);
}
.verdict h2{font-size:19px; line-height:1.5}
.verdict p{margin:10px 0 0; color:var(--ink-2); font-size:14.5px; max-width:70ch}

/* ---------- stat row ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:1px;
  background:var(--rule); border:1px solid var(--rule); border-radius:3px; margin-top:20px; overflow:hidden}
.stat{background:var(--raised); padding:18px 18px 16px; display:flex; flex-direction:column; gap:4px}
.stat-k{font-size:11.5px; color:var(--ink-3); letter-spacing:.04em; line-height:1.5}
.stat-v{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;
  font-size:26px; font-weight:600; letter-spacing:-.02em; line-height:1.15}
.stat-n{font-size:11.5px; color:var(--ink-3); line-height:1.5}

/* ---------- nav ---------- */
nav{position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--plane) 92%,transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--rule)}
.nav-in{max-width:1080px; margin:0 auto; padding-inline:20px; display:flex; gap:4px;
  overflow-x:auto; scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
nav a{
  flex:none; padding:12px 12px 10px; font-size:13px; color:var(--ink-3); text-decoration:none;
  border-bottom:2px solid transparent; white-space:nowrap
}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink); border-bottom-color:var(--accent)}
nav a .n{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--accent); margin-right:5px}

/* ---------- adjustable time range ---------- */
.rangebar{padding:8px 20px 0}
.rb-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:6px}
.rb-row button{font:inherit; font-size:12px; padding:3px 10px; border-radius:3px; cursor:pointer;
  border:1px solid var(--rule-strong); background:var(--surface); color:var(--ink-2)}
.rb-row button:hover{color:var(--ink); border-color:var(--ink-3)}
.rb-row button.on{background:var(--ink); color:var(--surface); border-color:var(--ink); font-weight:600}
.rb-row button:focus-visible,.rangebar svg:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.rb-info{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3)}
.rb-hint{font-size:11.5px; color:var(--ink-3); margin-top:4px}

/* ---------- chapter index ---------- */
.toc{margin-top:40px; border:1px solid var(--rule); border-radius:3px; background:var(--surface); padding:16px 20px 8px}
.toc h2{font-size:14px; font-weight:600; color:var(--ink-2); letter-spacing:.06em}
.toc ol{list-style:none; margin:10px 0 0; padding:0; display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); column-gap:28px}
.toc li{border-top:1px solid var(--rule)}
.toc a{display:grid; grid-template-columns:30px 1fr; gap:2px 8px; padding:10px 0; text-decoration:none; color:inherit}
.toc a:hover b{color:var(--accent)}
.toc a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.toc .n{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--accent); padding-top:2px; grid-row:span 2}
.toc b{font-size:14.5px; font-weight:600}
.toc span.q{font-size:12.5px; color:var(--ink-3); line-height:1.55}
nav a:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:2px}

/* ---------- sections ---------- */
section{padding-top:52px; scroll-margin-top:56px}
.sec-head{display:flex; align-items:baseline; gap:14px; border-bottom:1px solid var(--rule-strong); padding-bottom:10px}
.sec-no{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--accent); letter-spacing:.1em; flex:none}
.sec-head h2{font-size:23px; font-weight:700; letter-spacing:-.01em}
.sec-sub{color:var(--ink-2); font-size:14px; margin:14px 0 0; max-width:68ch}

/* ---------- panels & charts ---------- */
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:3px; margin-top:22px}
.panel-head{padding:16px 20px 0}
.panel-head h3{font-size:15.5px; font-weight:600; font-family:"Noto Sans TC",sans-serif}
.panel-head p{margin:6px 0 0; font-size:13px; color:var(--ink-2); max-width:70ch}
.panel-body{padding:12px 12px 16px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:22px; margin-top:22px}
.grid2 .panel{margin-top:0}
figure{margin:0}
figcaption{padding:0 20px 16px; font-size:12.5px; color:var(--ink-3); line-height:1.6}
svg{display:block; width:100%; height:auto; max-width:100%; overflow:visible}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; padding:4px 20px 0; font-size:12.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.swatch{width:14px; height:3px; border-radius:2px; flex:none}
.swatch.dot{width:9px; height:9px; border-radius:50%}

/* ---------- tables ---------- */
.tw{overflow-x:auto; border:1px solid var(--rule); border-radius:3px; background:var(--surface); margin-top:22px}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:560px}
caption{text-align:left; padding:16px 18px 12px; font-size:15.5px; font-weight:600; color:var(--ink)}
caption small{display:block; font-weight:400; font-size:12.5px; color:var(--ink-2); margin-top:5px; line-height:1.6}
th,td{padding:8px 12px; text-align:right; border-bottom:1px solid var(--rule); white-space:nowrap}
th{font-size:11px; font-weight:500; color:var(--ink-3); letter-spacing:.05em; text-align:right;
  background:var(--sunken); position:sticky; top:0}
th:first-child,td:first-child{text-align:left; position:sticky; left:0; background:var(--surface)}
th:first-child{background:var(--sunken); z-index:2}
tbody tr:hover td{background:var(--sunken)}
tbody tr:hover td:first-child{background:var(--sunken)}
tbody tr:last-child td{border-bottom:none}
#t-kd-down td:last-child,#t-kd-down th:last-child,#t-kd-up td:last-child,#t-kd-up th:last-child{text-align:left; white-space:normal}
#t-tech-moves td:last-child,#t-tech-moves th:last-child{text-align:left; white-space:normal; min-width:320px}
#t-tech-trans td.diag{color:var(--ink-3)}
#members td:not(.n),#members th{text-align:left}
#members th:nth-child(n+5){text-align:right}
#members td.c,#members th.c{text-align:center}
.mem-more{margin-top:22px}
.mem-more summary{cursor:pointer; font-size:14px; font-weight:600; color:var(--ink-2); padding:8px 0}
.mem-more summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
#t-bt-eps td:nth-child(8),#t-bt-eps th:nth-child(8){text-align:left; white-space:normal; min-width:220px; max-width:300px}
#t-bt-eps td:nth-child(9) .sub{white-space:nowrap}
#t-signals td:last-child,#t-signals th:last-child{text-align:left; white-space:normal; min-width:280px}
#t-signals td:nth-child(2),#t-signals th:nth-child(2){text-align:left}
td.n{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.sub{color:var(--ink-3); font-size:11.5px}
.tag{display:inline-block; padding:1px 7px; border-radius:2px; font-size:11px;
  font-family:"IBM Plex Mono",monospace; letter-spacing:.02em; border:1px solid transparent}
.tag.cyc{color:var(--s1); border-color:color-mix(in srgb,var(--s1) 35%,transparent); background:color-mix(in srgb,var(--s1) 9%,transparent)}
.tag.def{color:var(--s2); border-color:color-mix(in srgb,var(--s2) 35%,transparent); background:color-mix(in srgb,var(--s2) 9%,transparent)}

/* signal pills */
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500;
  font-family:"IBM Plex Mono",monospace; padding:2px 9px; border-radius:2px; border:1px solid}
.pill i{width:7px; height:7px; border-radius:50%; flex:none; font-style:normal}
.p-good{color:var(--good); border-color:color-mix(in srgb,var(--good) 40%,transparent); background:color-mix(in srgb,var(--good) 10%,transparent)}
.p-warn{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,transparent); background:color-mix(in srgb,var(--warn) 12%,transparent)}
.p-ser{color:var(--serious); border-color:color-mix(in srgb,var(--serious) 45%,transparent); background:color-mix(in srgb,var(--serious) 12%,transparent)}
.p-bad{color:var(--critical); border-color:color-mix(in srgb,var(--critical) 40%,transparent); background:color-mix(in srgb,var(--critical) 10%,transparent)}
.p-neu{color:var(--ink-2); border-color:var(--rule-strong); background:var(--sunken)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .p-warn{color:#e8a71a}}
:root[data-theme="dark"] .p-warn{color:#e8a71a}

/* inline bar inside a table cell */
.bar{position:relative; height:16px; min-width:110px; display:block}
.bar i{position:absolute; top:3px; height:10px; border-radius:2px; display:block}
.bar u{position:absolute; top:0; bottom:0; width:1px; background:var(--rule-strong); left:50%}

/* ---------- takeaways ---------- */
ul.take{list-style:none; padding:0; margin:20px 0 0; display:flex; flex-direction:column; gap:0}
ul.take li{display:grid; grid-template-columns:22px 1fr; gap:14px; padding:14px 0;
  border-bottom:1px solid var(--rule); font-size:14.5px; color:var(--ink-2)}
ul.take li:last-child{border-bottom:none}
ul.take li::before{content:attr(data-i); font-family:"IBM Plex Mono",monospace; font-size:12px;
  color:var(--ink-3); padding-top:3px}
ul.take li > span{min-width:0}
ul.take b{color:var(--ink); font-weight:500}

/* ---------- tooltip ---------- */
#tip{position:fixed; z-index:90; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--raised); color:var(--ink); border:1px solid var(--rule-strong); border-radius:3px;
  padding:9px 11px; font-size:12.5px; line-height:1.65; box-shadow:var(--shadow); max-width:250px}
#tip .tt-h{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--ink-3);
  letter-spacing:.04em; margin-bottom:4px}
#tip .tt-r{display:flex; align-items:center; gap:8px; justify-content:space-between}
#tip .tt-r span{display:inline-flex; align-items:center; gap:6px}
#tip b{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:600}

/* ---------- event timeline ---------- */
.ev-list{list-style:none; margin:0; padding:0 20px 14px; display:flex; flex-direction:column}
.ev-list li{display:grid; grid-template-columns:30px 76px 1fr; gap:4px 14px; padding:13px 0;
  border-top:1px solid var(--rule); align-items:start}
.ev-date{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-3); padding-top:3px}
.ev-body{min-width:0}
.ev-body b{font-weight:600; font-size:14px}
.ev-body p{margin:4px 0 0; color:var(--ink-2); font-size:13px; line-height:1.7}
.ev-meta{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:7px; font-size:12px; color:var(--ink-3)}
.ev-meta a{color:var(--accent); text-decoration:none; overflow-wrap:anywhere}
.ev-meta a:hover{text-decoration:underline}
.ev-meta a:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.cat{display:inline-block; font-size:11px; padding:0 6px; border-radius:2px; margin-left:8px;
  border:1px solid var(--rule-strong); color:var(--ink-2); vertical-align:2px}
.cat.soon{border-color:color-mix(in srgb,var(--warn) 55%,transparent); color:var(--ink)}
.mv{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.ev-badge{display:block}
@media (max-width:520px){
  .ev-list li{grid-template-columns:30px 1fr}
  .ev-body{grid-column:1/-1}
}
/* ---------- KD small multiples ---------- */
.kd-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; padding:8px 16px 18px}
.kd-cell{border:1px solid var(--rule); border-radius:3px; padding:10px 10px 4px; background:var(--raised)}
.kd-cell h4{margin:0 0 2px; font-size:13px; font-weight:600; display:flex; justify-content:space-between;
  gap:8px; font-family:"IBM Plex Mono",monospace}
.kd-cell h4 span{font-family:"Noto Sans TC",sans-serif; font-weight:400; font-size:11.5px; color:var(--ink-3)}
.note-box{margin-top:18px; padding:12px 16px; border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 9%,transparent); border-radius:3px; font-size:13px; color:var(--ink-2); max-width:78ch}
.note-box b{color:var(--ink)}
.zone{font-size:11px; padding:0 6px; border-radius:2px; border:1px solid var(--rule-strong); color:var(--ink-2); margin-left:6px}
.zone.main{border-color:color-mix(in srgb,var(--accent) 50%,transparent); color:var(--accent)}

footer{margin-top:56px; padding-top:24px; border-top:1px solid var(--rule);
  font-size:12.5px; color:var(--ink-3); line-height:1.8}
footer b{color:var(--ink-2); font-weight:500}
footer code{font-family:"IBM Plex Mono",monospace; font-size:11.5px; background:var(--sunken);
  padding:1px 5px; border-radius:2px; color:var(--ink-2)}
/* ---------- print / PDF ---------- */
@media print{
  nav, #tip, .rb-row button, .rangebar svg, .rb-hint{display:none!important}
  .rb-row{margin:0} .rb-info{margin-left:0}
  section{padding-top:28px}
  figure, .panel, .stats, .stat, .toc, .verdict, .note-box, tr, .sec-head{break-inside:avoid}
  .sec-head{break-after:avoid}
  .tw{overflow:visible!important}
  .mem-more summary{display:none}
  a{color:inherit; text-decoration:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
@media (max-width:520px){
  .mast-in{padding-block:30px 22px}
  .verdict{grid-template-columns:1fr; gap:14px}
  .verdict::before{grid-row:auto; width:32px; height:3px}
  .stat-v{font-size:22px}
}

.mast-in,.wrap{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.lead{color:var(--ink-2); font-size:14.5px; max-width:70ch; margin:10px 0 0}
td.l{text-align:left; white-space:normal; min-width:220px}
.ev-up{color:var(--ink-3)}
</style>

<header class="mast"><div class="mast-in">
  <p class="kicker">PHLX SEMICONDUCTOR INDEX · <span id="m-sym"></span></p>
  <h1 id="m-h1">—</h1>
  <p class="dek" id="m-dek">—</p>
  <div class="stamp"><span>資料日 <b id="m-asof"></b></span><span>報告產出 <b id="m-gen"></b></span><span>資料起點 <b id="m-start"></b></span></div>
  <div class="stats" id="m-stats"></div>
</div></header>

<div class="wrap">
<section id="long">
  <div class="sec-head"><span class="sec-no"></span><h2>長期走勢與回檔</h2></div>
  <p class="sec-sub" id="long-sub">—</p>
  <figure class="panel">
    <div class="panel-head"><h3>週收盤（對數刻度）與距歷史高點的跌幅</h3><p id="long-def">—</p></div>
    <div class="rb-row" id="long-rb" style="padding:10px 20px 0"></div>
    <div class="legend" id="long-lg"></div>
    <div class="panel-body"><div id="c-long"></div></div>
    <figcaption id="long-cap"></figcaption>
  </figure>
  <div class="tw"><table id="t-eps"><caption>歷次回檔<small id="eps-cap">—</small></caption></table></div>
</section>

<section id="recent">
  <div class="sec-head"><span class="sec-no"></span><h2>近半年日K與均線</h2></div>
  <p class="sec-sub" id="recent-sub">—</p>
  <figure class="panel">
    <div class="panel-head"><h3>日K、50 日與 200 日均線</h3><p>標記的編號對應下方事件表；漲跌幅都是本資料的收盤計算。</p></div>
    <div class="legend" id="k-lg"></div>
    <div class="panel-body"><div id="c-k"></div></div>
    <figcaption id="k-cap"></figcaption>
  </figure>
  <div class="tw"><table id="t-ev"><caption>事件<small>事件內容引自所列來源；漲跌幅是 ^SOX 當日收盤變化，由本資料計算，不採用文章數字。同日事件不代表因果。</small></caption></table></div>
</section>

<section id="breadth">
  <div class="sec-head"><span class="sec-no"></span><h2>成分股廣度</h2></div>
  <p class="sec-sub" id="br-sub">—</p>
  <div class="tw"><table id="t-br"><caption>目前讀數<small id="br-cap">—</small></caption></table></div>

<script>/* McClellan oscillator panel, shared by the S&P 500 report and the ^SOX review.
   Inlined into both pages at build time (build_report.py, sox_review.py). Every figure and
   every comparison word comes from the payload made by analysis/mcclellan.py. */
window.MCC = (function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg", MONO = "IBM Plex Mono, monospace", RANGE = {};
  function el(tag, at, txt) {
    var e = document.createElementNS(NS, tag);
    for (var k in at) if (at[k] !== null && at[k] !== undefined) e.setAttribute(k, at[k]);

  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };
  var sg = function (v, d) { return (v > 0 ? "+" : "") + v.toFixed(d === undefined ? 1 : d); };
  var pc = function (v, d) { return v === null || v === undefined ? "—" : sg(v, d === undefined ? 1 : d) + "%"; };
  var fmt = function (v) { return Math.round(v).toLocaleString("en-US"); };
  var tip = function () { return document.getElementById("tip"); };
  function showTip(html, ev) {

    t.innerHTML = html; t.style.opacity = 1;
    var x = ev.clientX + 14, y = ev.clientY + 14, r = t.getBoundingClientRect();
    if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
    t.style.left = x + "px"; t.style.top = y + "px";
  }
  function hideTip() { var t = tip(); if (t) t.style.opacity = 0; }

  function chart(host, M, o, a) {
    var n = M.dates.length - a, dates = M.dates.slice(a), osc = M.osc.slice(a), sum = M.sum.slice(a), idx = M.idx.slice(a);
    var w = Math.max(320, host.clientWidth), small = w < 520;
    var m = { l: small ? 46 : 54, r: small ? 58 : 72 };
    var P1 = { y: 10, h: small ? 130 : 160 }, P2 = { y: 0, h: small ? 130 : 160 }, P3 = { y: 0, h: small ? 90 : 110 };
    P2.y = P1.y + P1.h + 22; P3.y = P2.y + P2.h + 22;
    var h = P3.y + P3.h + 26, iw = w - m.l - m.r, svg = el("svg", { width: w, height: h, viewBox: "0 0 " + w + " " + h });
    svg.style.display = "block";
    var ink3 = css("--ink-3"), rule = css("--rule"), pos = css("--pos"), neg = css("--neg"), ink2 = css("--ink-2");
    var step = iw / n, X = function (i) { return m.l + step * (i + 0.5); };
    var scale = function (P, lo, hi) { return function (v) { return P.y + P.h * (1 - (v - lo) / ((hi - lo) || 1)); }; };
    var ticks = function (lo, hi, k) {
      var raw = (hi - lo) / k, mag = Math.pow(10, Math.floor(Math.log10(raw))), st = [1, 2, 2.5, 5, 10].map(function (f) { return f * mag; }).filter(function (x) { return x >= raw; })[0], out = [];
      for (var v = Math.ceil(lo / st) * st; v <= hi + 1e-9; v += st) out.push(v);
      return out;
    };
    var axis = function (P, Y, lo, hi, k, lab) {
      ticks(lo, hi, k).forEach(function (v) {
        svg.appendChild(el("line", { x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), stroke: v === 0 ? css("--axis") : rule }));
        svg.appendChild(el("text", { x: m.l - 6, y: Y(v) + 4, "text-anchor": "end", fill: ink3, "font-size": 10.5, "font-family": MONO }, lab(v)));
      });
    };
    var mn = function (a) { return Math.min.apply(null, a); }, mx = function (a) { return Math.max.apply(null, a); };
    // panel titles
    [[P1, o.idxName], [P2, "麥克連擺盪指標"], [P3, "總和指標（Summation Index）"]].forEach(function (p) {
      svg.appendChild(el("text", { x: m.l + 4, y: p[0].y + 11, fill: ink3, "font-size": 10.5 }, p[1]));
    });
    // 1: index
    var ilo = mn(idx) * 0.98, ihi = mx(idx) * 1.02, Y1 = scale(P1, ilo, ihi);
    axis(P1, Y1, ilo, ihi, 3, function (v) { return v >= 1000 ? (v / 1000).toFixed(1) + "k" : String(Math.round(v)); });
    var d = ""; idx.forEach(function (v, i) { d += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y1(v).toFixed(1); });
    svg.appendChild(el("path", { d: d, fill: "none", stroke: css("--ink"), "stroke-width": 1.6 }));
    // 2: oscillator bars with the thresholds
    var olo = Math.min(mn(osc), M.lo) * 1.1, ohi = Math.max(mx(osc), M.hi) * 1.1, Y2 = scale(P2, olo, ohi);
    axis(P2, Y2, olo, ohi, 4, function (v) { return String(Math.round(v)); });
    var bw = Math.max(1, step * 0.7);
    osc.forEach(function (v, i) {
      var y0 = Y2(0), y1 = Y2(v);
      svg.appendChild(el("rect", { x: X(i) - bw / 2, y: Math.min(y0, y1), width: bw, height: Math.max(0.5, Math.abs(y1 - y0)), fill: v >= 0 ? pos : neg,
        opacity: (v <= M.lo || v >= M.hi) ? 1 : 0.55 }));
    });
    [M.lo, M.hi].forEach(function (t) {
      svg.appendChild(el("line", { x1: m.l, x2: m.l + iw, y1: Y2(t), y2: Y2(t), stroke: css("--warn"), "stroke-width": 1.2, "stroke-dasharray": "4 3" }));
      svg.appendChild(el("text", { x: m.l + iw + 4, y: Y2(t) + 4, fill: ink2, "font-size": 10, "font-family": MONO }, sg(t, 0)));
    });
    // 3: summation index
    var slo = mn(sum), shi = mx(sum), pad = (shi - slo) * 0.08 || 10, Y3 = scale(P3, slo - pad, shi + pad);
    axis(P3, Y3, slo - pad, shi + pad, 3, function (v) { return fmt(v); });
    d = ""; sum.forEach(function (v, i) { d += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y3(v).toFixed(1); });
    svg.appendChild(el("path", { d: d, fill: "none", stroke: css("--s4"), "stroke-width": 1.6 }));
    // end labels
    var endLab = function (y, t) { svg.appendChild(el("text", { x: m.l + iw + 4, y: y + 4, fill: ink2, "font-size": 10.5, "font-weight": 600, "font-family": MONO }, t)); };
    endLab(Y1(idx[n - 1]), idx[n - 1] >= 1000 ? fmt(idx[n - 1]) : idx[n - 1].toFixed(1));
    var yo = Y2(osc[n - 1]); if (Math.abs(yo - Y2(M.lo)) < 11) yo = Y2(M.lo) + 12; if (Math.abs(yo - Y2(M.hi)) < 11) yo = Y2(M.hi) - 12;
    endLab(yo, sg(osc[n - 1], 0));
    endLab(Y3(sum[n - 1]), fmt(sum[n - 1]));
    // dates
    var stp = Math.max(1, Math.round(n / (small ? 4 : 7)));
    for (var q = 0; q < n; q += stp) {
      if (n - 1 - q < stp * 0.5 && q) continue;
      svg.appendChild(el("text", { x: X(q), y: h - 8, "text-anchor": q ? "middle" : "start", fill: ink3, "font-size": 10.5, "font-family": MONO }, dates[q].slice(2, 7).replace("-", "/")));
    }
    svg.appendChild(el("text", { x: X(n - 1), y: h - 8, "text-anchor": "end", fill: ink3, "font-size": 10.5, "font-family": MONO }, dates[n - 1].slice(5).replace("-", "/")));
    var cross = el("line", { y1: P1.y, y2: P3.y + P3.h, stroke: css("--ink"), opacity: 0 }); svg.appendChild(cross);
    var hit = el("rect", { x: m.l, y: P1.y, width: iw, height: P3.y + P3.h - P1.y, fill: "transparent" });
    hit.addEventListener("mousemove", function (ev) {
      var bb = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor((ev.clientX - bb.left - m.l) / step)));
      cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 0.3);
      showTip("<div class='tt-h'>" + dates[i] + "</div><div class='tt-r'><span>" + o.idxName + "</span><b>" + (idx[i] >= 1000 ? fmt(idx[i]) : idx[i].toFixed(1)) + "</b></div>" +
        "<div class='tt-r'><span>擺盪指標</span><b>" + sg(osc[i], 1) + "</b></div><div class='tt-r'><span>總和指標</span><b>" + fmt(sum[i]) + "</b></div>", ev);
    });
    hit.addEventListener("mouseleave", function () { hideTip(); cross.setAttribute("opacity", 0); });
    svg.appendChild(hit);
    host.innerHTML = ""; host.appendChild(svg);
  }

  function rangeButtons(host, M, o, redraw) {
    var N = M.dates.length, cur = RANGE[o.key] === undefined ? Infinity : RANGE[o.key];
    host.innerHTML = "";
    [["3 個月", 63], ["6 個月", 126], ["1 年", 252], ["全部", Infinity]].forEach(function (p) {
      if (p[1] !== Infinity && p[1] >= N) return;
      var b = document.createElement("button"); b.type = "button"; b.textContent = p[0];
      if (cur === p[1]) b.className = "on";
      b.setAttribute("aria-pressed", cur === p[1] ? "true" : "false");
      b.addEventListener("click", function () { RANGE[o.key] = p[1]; redraw(); });
      host.appendChild(b);
    });
    return Math.max(0, N - Math.min(N, cur));
  }

  function words(M, o) {
    var NM = (/^[A-Za-z^]/.test(o.idxName) ? " " : "") + o.idxName +                // CJK / Latin spacing
      (/[A-Za-z0-9]$/.test(o.idxName) ? " " : "");
    var lv = function (v) { return v >= 1000 ? fmt(v) : v.toFixed(1); };
    var Z = M.now, S = M.signals, B = M.base, V = M.div, H = M.fwd[M.fwd.length - 1], out = [];
    var zoneTxt = Z.zone === "oversold" ? "落在超賣區（≤ " + sg(M.lo, 0) + "）" : Z.zone === "overbought" ? "落在超買區（≥ " + sg(M.hi, 0) + "）" : "在超買與超賣門檻之間";
    var pTxt = Z.pctile <= 0 ? "為期間最低" : Z.pctile >= 99.5 ? "為期間最高" : "在期間第 " + Z.pctile.toFixed(0) + " 百分位";
    out.push("現在：擺盪指標 " + sg(Z.osc) + "，" + pTxt + "，" + zoneTxt + "；" +
      (Z.cross_date ? Z.since_cross + " 個交易日前（" + Z.cross_date + "）" + (Z.above_zero ? "由負轉正" : "由正轉負") + "。" : "期間沒有穿越零軸。") +
      "期間最低 " + sg(Z.min) + "（" + Z.min_date + "）、最高 " + sg(Z.max) + "（" + Z.max_date + "）。");
    out.push("總和指標 " + fmt(Z.sum) + "，近 10 個交易日" + (Z.sum_chg10 < 0 ? "下降 " + fmt(-Z.sum_chg10) : Z.sum_chg10 > 0 ? "上升 " + fmt(Z.sum_chg10) : "持平") +
      "——" + (Z.sum_chg10 < 0 ? "這 10 天的擺盪指標加總為負，下跌家數占上風。" : Z.sum_chg10 > 0 ? "這 10 天的擺盪指標加總為正，上漲家數占上風。" : "上漲與下跌家數大致相抵。"));
    var basePos = 100 * B.pos / B.n;
    ["oversold", "overbought"].forEach(function (k) {
      var s = S[k], thr = k === "oversold" ? "跌到 " + sg(M.lo, 0) + " 以下" : "升到 " + sg(M.hi, 0) + " 以上";
      if (!s.n) { out.push("期間擺盪指標沒有" + thr + "過。"); return; }
      var t = "過去" + thr + " " + s.n + " 次（" + M.gap + " 個交易日內重複只算一次）";
      if (!s.n_done) { out.push(t + "，都還不到 " + H + " 個交易日，看不到結果。"); return; }
      var gap = s.median - B.median;
      t += "：已有 " + H + " 日結果的 " + s.n_done + " 次，之後 " + H + " 個交易日" + NM + "報酬中位數 " + pc(s.median, 2) + "、上漲 " + s.pos + " 次；" +
        "所有交易日的同一數字是 " + pc(B.median, 2) + "、上漲占 " + basePos.toFixed(0) + "%，" +
        (Math.abs(gap) < 1 ? "相差不大。" : gap > 0 ? "訊號之後較好。" : "訊號之後較差。") + "樣本只有 " + s.n_done + " 次，只能當參考。";
      out.push(t);
    });
    var lowTxt = "近 " + M.recent + " 個交易日" + NM + "低點 " + lv(V.idx_low_recent) + "，前一段（再往前 " + (M.prior - M.recent) + " 日）低點 " + lv(V.idx_low_prior);
    var oscLow = "；擺盪指標低點 " + sg(V.osc_low_recent) + " 對 " + sg(V.osc_low_prior);
    var highTxt = "近 " + M.recent + " 個交易日" + NM + "高點 " + lv(V.idx_high_recent) + "，前一段高點 " + lv(V.idx_high_prior);
    var oscHigh = "；擺盪指標高點 " + sg(V.osc_high_recent) + " 對 " + sg(V.osc_high_prior);
    out.push("背離：" + ({
      positive: lowTxt + oscLow + "。指數創低、擺盪指標的低點卻較高，是正背離：跌的家數沒有跟著擴大，常出現在跌勢後段，但不保證已經見底。",
      confirmed_down: lowTxt + oscLow + "。指數與擺盪指標同步創低，下跌家數仍在擴散，沒有背離。",
      flat_down: lowTxt + oscLow + "。指數創低，擺盪指標低點和前一段相差不到 " + V.tol + " 點，看不出背離。",
      negative: highTxt + oscHigh + "。指數創高、擺盪指標的高點卻較低，是負背離：上漲集中在較少的股票。",
      confirmed_up: highTxt + oscHigh + "。指數與擺盪指標同步創高，上漲家數同步擴散，沒有背離。",
      flat_up: highTxt + oscHigh + "。指數創高，擺盪指標高點和前一段相差不到 " + V.tol + " 點，看不出背離。",
      none: "近 " + M.recent + " 個交易日" + NM + "既沒有跌破、也沒有突破前一段的高低點，不適用背離判讀。"
    })[V.kind]);
    return out;
  }

  function render(M, o) {
    var redraw = function () {
      var a = rangeButtons(document.getElementById(o.ids.rb), M, o, redraw);
      chart(document.getElementById(o.ids.chart), M, o, a);

    redraw();

      "<span><i class='swatch' style='background:" + css("--pos") + "'></i>擺盪指標 &gt; 0</span><span><i class='swatch' style='background:" + css("--neg") + "'></i>擺盪指標 &lt; 0</span>" +
      "<span><i class='swatch' style='background:" + css("--warn") + "'></i>超買／超賣門檻</span><span><i class='swatch' style='background:" + css("--s4") + "'></i>總和指標</span>";
    document.getElementById(o.ids.def).textContent = "擺盪指標＝每日（上漲家數 − 下跌家數）÷（上漲 + 下跌 + 平盤）× 1000，取 19 日與 39 日指數移動平均之差；總和指標是擺盪指標的逐日累加。" +
      "計算範圍：" + o.groupName + "。門檻 " + (M.fixed ? sg(M.lo, 0) + "／" + sg(M.hi, 0) + "（與廣度訊號板相同）" :
        sg(M.lo, 0) + "／" + sg(M.hi, 0) + "，取本組自己期間第 10／90 百分位——檔數少，擺盪幅度比全市場大，套用全市場的門檻會太常觸發") +
      "。前 " + M.warmup + " 個交易日是均線暖機期，不列入；資料期間 " + M.dates[0] + " 至 " + M.dates[M.dates.length - 1] + "。";
    document.getElementById(o.ids.cap).textContent = "深色長條是超出門檻的交易日。按鈕只改變畫面範圍，下方解讀是全期數字。";
    document.getElementById(o.ids.take).innerHTML = words(M, o).map(function (t, i) {
      return "<li data-i='" + String(i + 1).padStart(2, "0") + "'><span>" + t + "</span></li>";
    }).join("");
  }
  return { render: render };
})();
</script>
