name: Daily sp500/memory/software CSV refresh

on:
  schedule:
    # Goal: fresh US close data committed before 23:00 UTC (07:00 Taipei).
    # US close is 20:00 UTC (EDT) or 21:00 UTC (EST), so attempts start at 20:07.
    # GitHub delays scheduled runs under load — worst on round minutes — so these
    # use odd minutes and retry several times. A run that finds no new data makes
    # no commit, so the extra attempts are harmless (and free on a public repo).
    - cron: "7 20 * * *"
    - cron: "37 20 * * *"
    - cron: "7 21 * * *"
    - cron: "37 21 * * *"
    - cron: "7 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          FETCH_BASE: ${{ github.workspace }}/data/weekly_reutin
          FETCH_TABLEAU: ${{ github.workspace }}/data/tableau
        run: python fetch_sp500_memory_software.py

      - name: Commit refreshed CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly_reutin/*.csv
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily CSV refresh ($(date -u +%Y-%m-%d))"
          git push
