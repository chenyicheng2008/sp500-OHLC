name: Daily sp500/memory/software CSV refresh

on:
  schedule:
    # 21:30 UTC = 05:30 next day Taipei time, well after US market close.
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          FETCH_BASE: ${{ github.workspace }}/data/weekly_reutin
          FETCH_TABLEAU: ${{ github.workspace }}/data/tableau
        run: python fetch_sp500_memory_software.py

      - name: Commit refreshed CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly_reutin/*.csv
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily CSV refresh ($(date -u +%Y-%m-%d))"
          git push
